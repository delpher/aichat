name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # a stuck test used to hold the job for GitHub's six hours
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build (broker, adapters, web UI)
        run: npm run build
      - name: Backend tests
        run: npm test
      - name: Web UI tests
        run: npm run test:web

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: aichat-broker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          echo '{"agents":[]}' > agents.json
          docker run -d --name broker -p 8787:8787 -v "$PWD/agents.json:/app/config/agents.json" aichat-broker:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8787/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/ | grep -q '<div id="root">'
          curl -fs -o /dev/null http://127.0.0.1:8787/client/claude-channel.mjs
          docker logs broker
