name: Release

# Publishes a GitHub Release when a version tag is pushed:
#   npm version 0.2.0 && git push --follow-tags
# Tags look like v1.2.3 (or v1.2.3-rc.1, published as a prerelease that /releases/latest skips).
# Assets (stable names, see README "Релізи"):
#   aichat-<version>.zip, aichat-<version>.tar.gz   built broker + web UI + adapters + production node_modules
#   SHA256SUMS.txt                                  checksums of the archives
#   release.json                                    machine-readable manifest for the broker's self-update
# The Docker image is pushed to ghcr.io/<owner>/aichat:<version> (and :latest for non-prereleases).

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag is not a semver tag like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg. Use: npm version $version && git push --follow-tags"; exit 1
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build (broker, adapters, web UI)
        run: npm run build
      - name: Backend tests
        run: npm test
      - name: Web UI tests
        run: npm run test:web

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage/aichat"
          out="$RUNNER_TEMP/release"
          mkdir -p "$stage" "$out"
          # Production files only: tests are not shipped, dependencies are pure JS so one archive fits every OS.
          cp -r dist package.json package-lock.json README.md "$stage/"
          rm -rf "$stage/dist/test"
          (cd "$stage" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          printf '%s\n' "$VERSION" > "$stage/VERSION"
          (cd "$RUNNER_TEMP/stage" && zip -qr "$out/aichat-$VERSION.zip" aichat && tar -czf "$out/aichat-$VERSION.tar.gz" aichat)
          (cd "$out" && sha256sum "aichat-$VERSION.zip" "aichat-$VERSION.tar.gz" > SHA256SUMS.txt)
          node - "$out" <<'JS'
          const { readFileSync, statSync, writeFileSync } = require("node:fs");
          const { createHash } = require("node:crypto");
          const out = process.argv[2];
          const { VERSION, PRERELEASE, GITHUB_REPOSITORY, GITHUB_SHA, GITHUB_REF_NAME } = process.env;
          const asset = (name, format) => ({
            name,
            format,
            size: statSync(`${out}/${name}`).size,
            sha256: createHash("sha256").update(readFileSync(`${out}/${name}`)).digest("hex"),
          });
          const manifest = {
            schema: 1,
            name: "aichat",
            version: VERSION,
            tag: GITHUB_REF_NAME,
            prerelease: PRERELEASE === "true",
            commit: GITHUB_SHA,
            publishedAt: new Date().toISOString(),
            node: require("./package.json").engines.node,
            root: "aichat",
            entry: "dist/broker/main.js",
            assets: [asset(`aichat-${VERSION}.zip`, "zip"), asset(`aichat-${VERSION}.tar.gz`, "tar.gz")],
            docker: `ghcr.io/${GITHUB_REPOSITORY.toLowerCase()}:${VERSION}`,
          };
          writeFileSync(`${out}/release.json`, JSON.stringify(manifest, null, 2) + "\n");
          JS
          ls -l "$out"; cat "$out/release.json"

      - name: Smoke test the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/smoke"; mkdir -p "$dir"
          tar -xzf "$RUNNER_TEMP/release/aichat-$VERSION.tar.gz" -C "$dir"
          cd "$dir/aichat"
          echo '{"agents":[]}' > agents.json
          node dist/broker/main.js agents.json > broker.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8787/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/health | node -e "const h=JSON.parse(require('fs').readFileSync(0,'utf8')); if (h.version !== process.env.VERSION) { console.error('health says', h); process.exit(1) }"
          curl -fs http://127.0.0.1:8787/ | grep -q '<div id="root">'
          curl -fs -o /dev/null http://127.0.0.1:8787/client/claude-channel.mjs
          kill %1; cat broker.log

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$VERSION"
          [ "$PRERELEASE" = "false" ] && tags="$tags,$image:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--repo "$GITHUB_REPOSITORY" --title "AIChat $VERSION" --generate-notes --verify-tag)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # Created as a draft and published only once every asset is uploaded,
          # so an updater never sees a "latest" release without its files.
          gh release create "$GITHUB_REF_NAME" release/* --draft "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
