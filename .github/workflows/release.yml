name: Release

# Publishes a GitHub Release when a version tag is pushed:
#   npm version 0.2.0 && git push --follow-tags
# Tags look like v1.2.3 (or v1.2.3-rc.1, published as a prerelease that /releases/latest skips).
# Assets (stable names, see README "Релізи"):
#   aichat-<version>.zip, aichat-<version>.tar.gz   built broker + web UI + adapters + production node_modules
#   SHA256SUMS.txt                                  checksums of the archives
#   release.json                                    machine-readable manifest for the broker's self-update
# The Docker image is pushed to ghcr.io/<owner>/aichat:<version> (and :latest for non-prereleases).
#
# It can also be started by hand (Actions -> Release -> Run workflow) on master, e.g. from a phone.
# Then it builds and tests v<package.json version> and leaves a DRAFT release with all assets,
# aimed at the built commit. The workflow cannot create tags (the repo restricts tag creation and
# has immutable releases), so a person publishes the draft and creates the tag in the web UI.
# That tag push starts this workflow again: the release already exists, so it only pushes the Docker image.
# Never delete or move a version tag: GitHub will not let anyone create that tag name again.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check tag matches package.json
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "::error::Run the Release workflow by hand only on master (got $GITHUB_REF)"; exit 1
            fi
            tag="v$pkg"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump the version in package.json first."; exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          # A tag created by publishing a draft from a manual run: the release and its assets already exist.
          published=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "Release $tag is already published, only the Docker image is pushed"
            published=true
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag is not a semver tag like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg. Use: npm version $version && git push --follow-tags"; exit 1
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - run: npm ci
        if: steps.version.outputs.published != 'true'
      - name: Type check
        if: steps.version.outputs.published != 'true'
        run: npm run typecheck
      - name: Build (broker, adapters, web UI)
        if: steps.version.outputs.published != 'true'
        run: npm run build
      - name: Backend tests
        if: steps.version.outputs.published != 'true'
        run: npm test
      - name: Web UI tests
        if: steps.version.outputs.published != 'true'
        run: npm run test:web

      - name: Package
        if: steps.version.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage/aichat"
          out="$RUNNER_TEMP/release"
          mkdir -p "$stage" "$out"
          # Production files only: tests are not shipped, dependencies are pure JS so one archive fits every OS.
          cp -r dist package.json package-lock.json README.md "$stage/"
          rm -rf "$stage/dist/test"
          (cd "$stage" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          printf '%s\n' "$VERSION" > "$stage/VERSION"
          (cd "$RUNNER_TEMP/stage" && zip -qr "$out/aichat-$VERSION.zip" aichat && tar -czf "$out/aichat-$VERSION.tar.gz" aichat)
          (cd "$out" && sha256sum "aichat-$VERSION.zip" "aichat-$VERSION.tar.gz" > SHA256SUMS.txt)
          node - "$out" <<'JS'
          const { readFileSync, statSync, writeFileSync } = require("node:fs");
          const { createHash } = require("node:crypto");
          const out = process.argv[2];
          const { VERSION, PRERELEASE, TAG, GITHUB_REPOSITORY, GITHUB_SHA } = process.env;
          const asset = (name, format) => ({
            name,
            format,
            size: statSync(`${out}/${name}`).size,
            sha256: createHash("sha256").update(readFileSync(`${out}/${name}`)).digest("hex"),
          });
          const manifest = {
            schema: 1,
            name: "aichat",
            version: VERSION,
            tag: TAG,
            prerelease: PRERELEASE === "true",
            commit: GITHUB_SHA,
            publishedAt: new Date().toISOString(),
            node: require("./package.json").engines.node,
            root: "aichat",
            entry: "dist/broker/main.js",
            assets: [asset(`aichat-${VERSION}.zip`, "zip"), asset(`aichat-${VERSION}.tar.gz`, "tar.gz")],
            docker: `ghcr.io/${GITHUB_REPOSITORY.toLowerCase()}:${VERSION}`,
          };
          writeFileSync(`${out}/release.json`, JSON.stringify(manifest, null, 2) + "\n");
          JS
          ls -l "$out"; cat "$out/release.json"

      - name: Smoke test the archive
        if: steps.version.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/smoke"; mkdir -p "$dir"
          tar -xzf "$RUNNER_TEMP/release/aichat-$VERSION.tar.gz" -C "$dir"
          cd "$dir/aichat"
          echo '{"agents":[]}' > agents.json
          AICHAT_HOME="$dir/versions" node dist/launcher.js agents.json > broker.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8787/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8787/health | node -e "const h=JSON.parse(require('fs').readFileSync(0,'utf8')); if (h.version !== process.env.VERSION) { console.error('health says', h); process.exit(1) }"
          curl -fs http://127.0.0.1:8787/ | grep -q '<div id="root">'
          curl -fs -o /dev/null http://127.0.0.1:8787/client/claude-channel.mjs
          kill %1; cat broker.log

      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.published != 'true'
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    # A manual run only leaves a draft; the image is pushed by the tag push that publishing it creates.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$VERSION"
          [ "$PRERELEASE" = "false" ] && tags="$tags,$image:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.build.outputs.published != 'true' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          flags=(--repo "$GITHUB_REPOSITORY" --title "AIChat $VERSION" --generate-notes)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # Created as a draft and published only once every asset is uploaded,
          # so an updater never sees a "latest" release without its files.
          gh release create "$TAG" release/* --draft "${flags[@]}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::notice::Draft release $TAG is ready. Publish it in the web UI with a new tag $TAG on $GITHUB_SHA."
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
